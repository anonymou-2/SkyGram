name: Build SkyGram
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install NDK and SDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore skygram.keystore -alias skygram -keyalg RSA -keysize 2048 -validity 10000 -storepass skygram123 -keypass skygram123 -dname "CN=SkyGram, OU=SkyGram, O=SkyGram, L=City, S=State, C=US"
          cp skygram.keystore TMessagesProj/

      - name: Create Dummy Firebase Config
        run: |
          echo '{"project_info": {"project_number": "1234567890","project_id": "skygram-dummy","storage_bucket": "skygram-dummy.appspot.com"},"client": [{"client_info": {"mobilesdk_app_id": "1:1234567890:android:1234567890abcdef","android_client_info": {"package_name": "com.skygram.messenger"}},"oauth_client": [],"api_key": [{"current_key": "AIzaSyDummyKeyForBuildOnly"}],"services": {"appinvite_service": {"other_platform_oauth_client": []}}}],"configuration_version": "1"}' > TMessagesProj/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease -PRELEASE_STORE_FILE=skygram.keystore -PRELEASE_STORE_PASSWORD=skygram123 -PRELEASE_KEY_ALIAS=skygram -PRELEASE_KEY_PASSWORD=skygram123

      - name: Upload APK and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: SkyGram-Release
          path: |
            TMessagesProj/build/outputs/apk/release/*.apk
            skygram.keystore
